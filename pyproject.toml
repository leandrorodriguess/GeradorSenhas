[project]
name = "securepass"
version = "1.0.0"
description = "SecurePass — Gerador de senhas criptograficamente seguras (web, API REST e CLI)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "black>=24.0",
    "ruff>=0.6",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# E/W: PEP 8 | F: Pyflakes | I: isort | N: nomes | B: bugbear | UP: pyupgrade
# SIM: simplificações | S: segurança (Bandit) | D: docstrings
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "S", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Nos testes, assert é o mecanismo esperado e docstrings por teste seriam ruído.
# S105/S106 acusam "senhas fixas", mas nos testes são saídas esperadas de mocks.
# S603 acusa subprocess; o teste da CLI executa o próprio interpretador.
"tests/**" = ["S101", "S105", "S106", "S603", "D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
# O Starlette 1.9 sugere migrar para httpx2; o projeto mantém o HTTPX por ser a
# ferramenta exigida nos requisitos. Apenas este aviso específico é silenciado.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
